# Android unit tests and a debug APK. iOS compile stays on a Mac with Xcode
# (the Shared framework build still needs JDK 17+ and Android SDK 35).

name: Android

on:
  push:
  pull_request:

jobs:
  test-and-assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests and debug APK
        run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleDebug --stacktrace
