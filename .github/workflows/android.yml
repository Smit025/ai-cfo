# Android unit tests and a debug APK. iOS compile stays on a Mac with Xcode
# (the Shared framework build still needs JDK 17+ and Android SDK 35).

name: Android

on:
  push:
  pull_request:

jobs:
  test-and-assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v4 installs cmdline-tools and does not request the obsolete `tools` package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Unit tests and debug APK
        run: ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest :androidApp:assembleDebug --stacktrace
